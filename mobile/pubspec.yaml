name: nizkhata
description: NizKhata — native Android app. Every rupee, accounted for.
publish_to: "none"
version: 1.6.2+50

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (native) — same backend/project as the web app.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  google_sign_in: ^6.2.2

  # State management — mirrors the web app's React context providers.
  provider: ^6.1.2

  # Routing.
  go_router: ^14.6.2

  # Charts (sparklines, donuts, bars) — replaces recharts.
  fl_chart: ^0.69.2

  # Formatting (en-IN currency/date) — replaces Intl.NumberFormat/DateTimeFormat.
  intl: ^0.19.0

  # Local prefs (active workspace, column choices) — replaces localStorage.
  shared_preferences: ^2.3.3

  # CSV export share sheet — replaces browser blob download.
  share_plus: ^10.1.2
  path_provider: ^2.1.5

  google_fonts: ^6.2.1

  # Due reminders (local scheduled notifications; fire via AlarmManager even
  # when the app is closed), home-screen widget data, and app shortcuts.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
  quick_actions: ^1.1.0
  home_widget: ^0.7.0

  # Statement import — all parsing on-device, no backend:
  # file picking, CSV, XLSX, and PDF text extraction (incl. password-protected).
  file_picker: ^10.3.3
  csv: ^6.0.0
  syncfusion_flutter_pdf: ^28.1.33
  # xlsx is a zip of XML parts; we read it directly (the `excel` package chokes
  # on many real-world/openpyxl-authored files) for reliable statement import.
  archive: ^3.6.0
  xml: ^6.5.0
  # AES/SHA for decrypting password-protected Office documents on-device
  # (ECMA-376 agile/standard encryption). Pure Dart — no platform code.
  pointycastle: ^4.0.0
  crypto: ^3.0.0
  # Keystore-backed storage for remembered statement passwords (encrypted at
  # rest on-device; never leaves the device).
  flutter_secure_storage: ^9.2.4
  # Biometric/device-credential app lock.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/

# App launcher icon — full brand mark (assets/icon.png) on the dark-navy brand
# field (#141A2A), matching the splash so the icon and splash feel like one set.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#141A2A"
  adaptive_icon_foreground: "assets/icon.png"

# Native splash — adapts to theme: white in light mode, dark navy in dark. Uses
# assets/splash.png (the logo centered with transparent margin) so the mark
# renders smaller than the full icon. Android 12+ uses its own splash API.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#141A2A"
  image: "assets/splash.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#141A2A"
    image: "assets/splash.png"
  android: true
  ios: false
  web: false
