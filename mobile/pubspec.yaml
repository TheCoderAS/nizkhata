name: nizkhata
description: NizKhata — native Android app. Every rupee, accounted for.
publish_to: "none"
version: 1.0.8+9

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (native) — same backend/project as the web app.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  google_sign_in: ^6.2.2

  # State management — mirrors the web app's React context providers.
  provider: ^6.1.2

  # Routing.
  go_router: ^14.6.2

  # Charts (sparklines, donuts, bars) — replaces recharts.
  fl_chart: ^0.69.2

  # Formatting (en-IN currency/date) — replaces Intl.NumberFormat/DateTimeFormat.
  intl: ^0.19.0

  # Local prefs (active workspace, column choices) — replaces localStorage.
  shared_preferences: ^2.3.3

  # CSV export share sheet — replaces browser blob download.
  share_plus: ^10.1.2
  path_provider: ^2.1.5

  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/

# App launcher icon — assets/icon.png is the transparent-background brand mark.
# White adaptive background so the blue logo reads cleanly on the tile.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  # Brand indigo tile: reads as intentional on both light and dark home screens
  # (a white tile looked harsh in dark mode; a dark-navy tile hid the dark logo).
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon.png"

# Native splash — adapts to theme: white in light mode, dark navy in dark. The
# transparent logo blends on either. Android 12+ uses its own splash API.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#141A2A"
  image: "assets/icon.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#141A2A"
    image: "assets/icon.png"
  android: true
  ios: false
  web: false
