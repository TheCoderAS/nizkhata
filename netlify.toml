# Netlify configuration. Deploys are driven by the GitHub Action
# (.github/workflows/deploy-netlify.yml), but these settings also apply if the
# site is connected to Netlify's own CI.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_USE_EMULATORS = "false"

# SPA fallback: every route is served by the client-side router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
