<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1120" />
    <meta
      name="description"
      content="NizKhata is a shared, multi-workspace accounting app — track multi-line transactions, accounts, contacts, debts, dues and financial-year tax summaries with role-based access."
    />
    <meta name="keywords" content="NizKhata, shared accounting, khata, expense tracker, multi-line transactions, debts, dues, financial year tax, household finance, India" />
    <meta name="author" content="NizKhata" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NizKhata" />
    <link rel="canonical" href="https://nizkhata.web.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NizKhata" />
    <meta property="og:title" content="NizKhata — Every rupee, accounted for." />
    <meta
      property="og:description"
      content="Shared, multi-workspace accounting: multi-line transactions, debts, dues and FY tax summaries with role-based access."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Shared, multi-workspace accounting: multi-line transactions, debts, dues and FY tax summaries."
    />
    <meta name="twitter:image" content="https://nizkhata.web.app/og-image.png" />

    <title>NizKhata — Every rupee, accounted for.</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("ui-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
