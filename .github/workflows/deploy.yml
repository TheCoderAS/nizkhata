name: Deploy to Firebase

# Deploys the static landing page + Firestore Security Rules + indexes to the
# `nizkhata` Firebase project whenever a PR is merged into main (i.e. a push to
# main). Manual runs are also allowed via the Actions tab.
#
# The web app was retired: hosting now serves landing/ (a static page linking
# the latest Android APK) with the /.well-known/assetlinks.json rewrite that
# Android App Links verification depends on.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT_NIZKHATA
#     The full JSON of a Firebase service account with deploy permissions.

run-name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't cancel an in-flight deploy; let it finish to keep prod consistent.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIZKHATA }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_NIZKHATA secret is not set."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Deploy hosting, rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --project nizkhata \
            --non-interactive \
            --force

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
