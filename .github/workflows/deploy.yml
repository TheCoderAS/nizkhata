name: Deploy to Firebase

# Deploys the app + Firestore Security Rules + indexes to the `nizkhata` Firebase
# project whenever a PR is merged into main (i.e. a push to main). Manual runs
# are also allowed via the Actions tab.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT_NIZKHATA
#     The full JSON of a Firebase service account with deploy permissions.
#     Create it: Firebase Console -> Project settings -> Service accounts ->
#     "Generate new private key", then paste the entire JSON file contents as
#     the secret value. The default App Engine service account has the roles
#     needed to deploy Hosting + Firestore rules + indexes.
#
# The six VITE_FIREBASE_* values are public (they ship in the client bundle), so
# they're inlined here rather than stored as secrets.

run-name: Deploy · ${{ github.ref_name }}@${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't cancel an in-flight deploy; let it finish to keep prod consistent.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_USE_EMULATORS: "false"
          VITE_FIREBASE_API_KEY: AIzaSyAiCtL1MqHDuzpNvCRGIpnuEY1vJTHN03I
          VITE_FIREBASE_AUTH_DOMAIN: nizkhata.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: nizkhata
          VITE_FIREBASE_STORAGE_BUCKET: nizkhata.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "626552427608"
          VITE_FIREBASE_APP_ID: 1:626552427608:web:de49ec934a647fce06a62d
          VITE_FIREBASE_MEASUREMENT_ID: G-N6JH009E7Q

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIZKHATA }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_NIZKHATA secret is not set."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Deploy hosting, rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --project nizkhata \
            --non-interactive \
            --force

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
