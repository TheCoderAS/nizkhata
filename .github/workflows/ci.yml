name: CI

# Quality gate. Runs on PRs into main so broken changes can't merge. The web
# app was retired in favour of the native Android app (mobile/, built by
# android-apk.yml); what remains here is the static landing page and the
# Firestore Security Rules shared by all clients.

run-name: Build and Test PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept under its historical name so branch-protection required checks stay
  # satisfied. Validates the landing page + firebase config instead of the
  # retired React build.
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate landing page and firebase.json
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('landing/index.html', 'utf8');
            const must = [
              'releases/latest/download/app-release.apk',
              '<title>',
              'og:image',
            ];
            for (const m of must) {
              if (!html.includes(m)) { console.error('landing/index.html missing: ' + m); process.exit(1); }
            }
            const fb = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
            if (fb.hosting.public !== 'landing') { console.error('hosting.public must be landing'); process.exit(1); }
            const rw = (fb.hosting.rewrites || []).some(r => r.source === '/.well-known/assetlinks.json');
            if (!rw) { console.error('assetlinks rewrite missing — Android App Links would break'); process.exit(1); }
            for (const f of ['landing/well-known-assetlinks.json', 'landing/logo.png', 'landing/robots.txt']) {
              if (!fs.existsSync(f)) { console.error('missing asset: ' + f); process.exit(1); }
            }
            console.log('landing page OK');
          "

  rules-tests:
    name: Firestore Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # firebase-tools requires JDK 21+ to run the Firestore emulator.
      - name: Setup Java (Firestore emulator requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run the rules matrix against the emulator
        run: firebase emulators:exec --only firestore --project demo-rules-test "npm run test:rules"
