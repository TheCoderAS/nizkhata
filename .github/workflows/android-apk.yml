name: Android APK

# Builds the native Flutter Android app in /mobile and publishes the APK.
# - Runs on demand (workflow_dispatch) and on version tags (v*), which also
#   attach the APK to a GitHub Release.
# - The Android platform scaffold (android/ dir) is generated by `flutter create`
#   at build time so it always matches the CI Flutter/AGP toolchain; only lib/,
#   pubspec.yaml and assets/ are tracked in git.
# - Firebase client config + the Google Web client ID are injected via
#   --dart-define from repo secrets (all optional — the app still builds without
#   them; sign-in just needs them at runtime). See mobile/README.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      # Build on pushes to the app branch during development. Remove before
      # merging to main (kept here so the APK build is validated on every push).
      - "claude/android-app"

permissions:
  contents: write

# During rapid dev iteration, cancel an in-flight build when a newer commit lands.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --org com.nizkhata --project-name nizkhata .
          # flutter create may rewrite our tracked files — restore them.
          git checkout -- lib pubspec.yaml
          rm -f test/widget_test.dart

      - name: Ensure INTERNET permission + minSdk 31 (Android 12)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
              open(p, 'w').write(s)
              print('INTERNET permission added')
          else:
              print('INTERNET permission already present')
          PY
          # Minimum supported platform: Android 12 (API 31).
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 31/g' "$f"
            sed -i -E 's/minSdk(Version)? +[0-9]+/minSdk = 31/g' "$f"
          done

      - name: Optional google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "No google-services.json secret — using manual FirebaseOptions."
          fi

      - name: Pub get
        run: flutter pub get

      - name: Launcher icons (best effort)
        run: dart run flutter_launcher_icons || echo "icon generation skipped"

      - name: Build APK
        env:
          # Firebase config reuses the SAME secrets the web app uses (VITE_FIREBASE_*),
          # so you configure them once. Only GOOGLE_WEB_CLIENT_ID is Android-specific.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_MEASUREMENT_ID="$FIREBASE_MEASUREMENT_ID"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nizkhata-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
