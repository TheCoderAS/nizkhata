name: Android APK

# Builds the native Flutter Android app in /mobile and publishes the APK.
# - Runs on demand (workflow_dispatch) and on version tags (v*), which also
#   attach the APK to a GitHub Release.
# - The Android platform scaffold (android/ dir) is generated by `flutter create`
#   at build time so it always matches the CI Flutter/AGP toolchain; only lib/,
#   pubspec.yaml and assets/ are tracked in git.
# - Firebase client config + the Google Web client ID are injected via
#   --dart-define from repo secrets (all optional — the app still builds without
#   them; sign-in just needs them at runtime). See mobile/README.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish a signed release (e.g. v1.0.0). Empty = build only."
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      # Build on the mainline and on the app dev branch.
      - "main"
      - "claude/android-app"

permissions:
  contents: write

# During rapid dev iteration, cancel an in-flight PUSH build when a newer commit
# lands — but release (workflow_dispatch) runs get a unique group so they can
# never cancel each other or be cancelled (back-to-back releases were killing
# each other's publish step).
concurrency:
  group: android-apk-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --org com.nizkhata --project-name nizkhata .
          # flutter create may rewrite our tracked files — restore them.
          git checkout -- lib pubspec.yaml
          rm -f test/widget_test.dart

      - name: Ensure INTERNET permission + app label + App Links + minSdk 31 (Android 12)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
              print('INTERNET permission added')
          else:
              print('INTERNET permission already present')
          # Launcher name must be the branded, correctly-cased "NizKhata"
          # (flutter create emits the lowercase project name by default).
          s2 = re.sub(r'android:label="[^"]*"', 'android:label="NizKhata"', s, count=1)
          if s2 != s:
              print('app label set to NizKhata')
              s = s2
          # Verified Android App Links for https://nizkhata.web.app + enable
          # Flutter's deep-link routing so go_router receives the incoming path.
          if 'nizkhata.web.app' not in s:
              applink = (
                  '\n'
                  '            <meta-data android:name="flutter_deeplinking_enabled" android:value="true" />\n'
                  '            <intent-filter android:autoVerify="true">\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="https" android:host="nizkhata.web.app" />\n'
                  '            </intent-filter>\n'
                  '        '
              )
              s = s.replace('</activity>', applink + '</activity>', 1)
              print('App Links intent-filter added')
          # Due reminders: notification + boot + exact-alarm permissions.
          for perm in ['android.permission.POST_NOTIFICATIONS',
                       'android.permission.RECEIVE_BOOT_COMPLETED',
                       'android.permission.USE_EXACT_ALARM',
                       'android.permission.VIBRATE']:
              if perm not in s:
                  s = re.sub(r'(<manifest[^>]*>)',
                             r'\1\n    <uses-permission android:name="%s"/>' % perm, s, count=1)
          # flutter_local_notifications receivers (scheduled + reboot re-registration)
          # and the home-screen widget provider.
          if 'ScheduledNotificationReceiver' not in s:
              receivers = (
                  '\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
                  '        <receiver android:name=".DuesWidgetProvider" android:exported="false">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>\n'
                  '            </intent-filter>\n'
                  '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/dues_widget_info"/>\n'
                  '        </receiver>\n'
                  '        <service android:name=".DuesWidgetService" android:permission="android.permission.BIND_REMOTEVIEWS" android:exported="false"/>\n'
                  '    '
              )
              s = s.replace('</application>', receivers + '</application>', 1)
              print('notification + widget receivers added')
          open(p, 'w').write(s)
          PY
          # flutter_local_notifications requires core library desugaring.
          python3 - <<'PY2'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
              if re.search(r'^dependencies\s*\{', s, flags=re.M):
                  s = re.sub(r'(^dependencies\s*\{)', r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', s, count=1, flags=re.M)
              else:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              open(p, 'w').write(s)
              print('desugaring enabled')
          gp = 'android/gradle.properties'
          props = open(gp).read()
          if 'kotlin.jvm.target.validation.mode' not in props:
              open(gp, 'a').write('\n# Plugin Kotlin/Java jvm-target mismatches (e.g. a plugin pinning 1.8)\n# should warn, not fail the whole build.\nkotlin.jvm.target.validation.mode=warning\n')
              print('kotlin jvm-target validation relaxed')
          if 'android.enableR8.fullMode' not in props:
              open(gp, 'a').write('# R8 full mode strips GSON generic signatures, crash-looping\n# flutter_local_notifications at startup in release builds.\nandroid.enableR8.fullMode=false\n')
              print('R8 full mode disabled')
          # Keep rules so R8 never strips GSON/plugin reflection used by
          # flutter_local_notifications' scheduled-notification storage.
          open('android/app/proguard-rules.pro', 'w').write('''# flutter_local_notifications + GSON (reflection-based serialization)
          -keep class com.dexterous.** { *; }
          -keep class com.google.gson.** { *; }
          -keepattributes Signature
          -keepattributes *Annotation*
          -keep class * implements com.google.gson.TypeAdapterFactory
          -keep class * implements com.google.gson.JsonSerializer
          -keep class * implements com.google.gson.JsonDeserializer
          -keepclassmembers,allowobfuscation class * { @com.google.gson.annotations.SerializedName <fields>; }
          -keep,allowobfuscation,allowshrinking class com.google.gson.reflect.TypeToken
          -keep,allowobfuscation,allowshrinking class * extends com.google.gson.reflect.TypeToken
          '''.replace('\n          ', '\n'))
          print('proguard rules written')
          s2 = open('android/app/build.gradle.kts').read()
          if 'proguard-rules.pro' not in s2:
              import re as re2
              s2 = re2.sub(r'(release\s*\{)', r'\1\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")', s2, count=1)
              open('android/app/build.gradle.kts', 'w').write(s2)
              print('proguardFiles wired into release build type')
          PY2
          # Inject the native home-screen widget sources (provider + layouts).
          mkdir -p android/app/src/main/kotlin
          cp -r android-extras/kotlin/. android/app/src/main/kotlin/
          cp -r android-extras/res/. android/app/src/main/res/
          echo "widget sources injected"
          # Minimum supported platform: Android 12 (API 31).
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 31/g' "$f"
            sed -i -E 's/minSdk(Version)? +[0-9]+/minSdk = 31/g' "$f"
          done

      - name: Optional google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "No google-services.json secret — using manual FirebaseOptions."
          fi

      - name: Configure release signing (if keystore secret present)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — release will be debug-signed (unstable SHA-1)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          # Trim any stray whitespace/newlines from the secret values.
          STOREPW="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          ALIAS="$(printf '%s' "${ANDROID_KEY_ALIAS:-nizkhata}" | tr -d '\r\n')"
          # The keystore is PKCS12, where the key password ALWAYS equals the
          # store password (a separate key password isn't supported). So use the
          # store password for the key too — ANDROID_KEY_PASSWORD is not needed.
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STOREPW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$STOREPW"
          } > android/key.properties
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'key.properties' not in s:
              if 'import java.util.Properties' not in s:
                  s = 'import java.util.Properties\n' + s
              loader = (
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystorePropertiesFile.inputStream().use { input -> keystoreProperties.load(input) }\n'
                  '}\n\n'
              )
              s = re.sub(r'\nandroid \{', '\n' + loader + 'android {', s, count=1)
          if 'signingConfigs {' not in s:
              sign = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String?\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String?\n'
                  '            storeFile = (keystoreProperties["storeFile"] as String?)?.let { file(it) }\n'
                  '            storePassword = keystoreProperties["storePassword"] as String?\n'
                  '        }\n'
                  '    }\n'
              )
              s = re.sub(r'\n(\s*)buildTypes \{', '\n' + sign + r'\1buildTypes {', s, count=1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          open(p, 'w').write(s)
          print('release signing wired')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Native splash screen (best effort)
        run: dart run flutter_native_splash:create || echo "splash generation skipped"

      - name: Launcher icons (best effort)
        run: dart run flutter_launcher_icons || echo "icon generation skipped"

      - name: Build APK
        # All Firebase/OAuth config is baked into lib/firebase_options.dart
        # (public values from google-services.json), so no config secrets are
        # needed. Only the release keystore (signing step above) is secret.
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nizkhata-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Publish the raw, directly-installable APK to a rolling pre-release so it
      # can be downloaded/installed on a phone without unzipping an artifact.
      # The runner creates/updates the `android-latest` tag via its own token.
      - name: Publish APK to rolling pre-release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/android-app')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: NizKhata Android (latest)
          prerelease: true
          files: mobile/build/app/outputs/flutter-apk/app-release.apk

      # Version tags (vX.Y.Z) get their own permanent release.
      - name: Attach APK to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk

      # Manual dispatch with a version input publishes a permanent, versioned
      # release (creates the tag via the runner token — no local tag push needed).
      - name: Publish versioned release (dispatch)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: NizKhata Android ${{ inputs.version }}
          prerelease: false
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
