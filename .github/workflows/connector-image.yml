name: Connector image

# Builds the connector (connector/) into a Docker image, pushes it to a
# private Docker Hub repository, and tells Render to deploy that exact image.
# Runs when a merge to main changes the connector; a manual run always builds.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME       Docker Hub account that owns the repository.
#   DOCKERHUB_TOKEN          A Docker Hub access token with Read & Write.
#   RENDER_DEPLOY_HOOK_URL   The service's Deploy Hook (Render > Settings).
#                            Optional: without it the image is only pushed.
# Repository variable (optional):
#   DOCKERHUB_REPOSITORY     e.g. myname/nizkhata-connector. Defaults to
#                            <DOCKERHUB_USERNAME>/nizkhata-connector.

run-name: Connector image ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "connector/**"
      - ".github/workflows/connector-image.yml"
  workflow_dispatch:

concurrency:
  group: connector-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/nizkhata-connector', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USER" ] || [ -z "$TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          echo "sha=docker.io/${REPOSITORY}:sha-${short}" >> "$GITHUB_OUTPUT"
          echo "latest=docker.io/${REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      # Render runs linux/amd64.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: connector
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.latest }}
          cache-from: type=gha,scope=connector
          cache-to: type=gha,mode=max,scope=connector
          provenance: false

      # Render does not watch registries: the deploy hook, given the image's
      # commit tag, deploys exactly what was just pushed.
      - name: Deploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ steps.tags.outputs.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not set; image pushed, not deployed."
            exit 0
          fi
          img=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["IMAGE"],safe=""))')
          sep='?'; case "$HOOK" in *\?*) sep='&';; esac
          curl -fsS -X POST "${HOOK}${sep}imgURL=${img}" -o /dev/null -w "Render answered %{http_code}\n"

      - name: Summary
        run: |
          {
            echo "### Connector image"
            echo "- \`${{ steps.tags.outputs.sha }}\`"
            echo "- \`${{ steps.tags.outputs.latest }}\`"
            echo "- digest \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
