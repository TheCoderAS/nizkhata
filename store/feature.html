<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{position:relative;font-family:Inter,sans-serif;color:#ECEEF6;background:#0B0F1C}
.bg{position:absolute;inset:0;background:
 radial-gradient(520px 420px at 12% 18%,rgba(79,70,229,.55),transparent 70%),
 radial-gradient(460px 380px at 92% 30%,rgba(124,58,237,.45),transparent 70%),
 radial-gradient(420px 300px at 70% 110%,rgba(16,185,129,.22),transparent 70%)}
.paper{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 60px,rgba(248,113,113,.14) 60px 61px,transparent 61px),repeating-linear-gradient(180deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:44px;padding:0 70px 0 110px}
.icon{width:210px;height:210px;flex:none;border-radius:52px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);box-shadow:0 0 90px 10px rgba(79,70,229,.5)}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:76px;font-weight:800;letter-spacing:-2.5px;line-height:1}
.tag{margin-top:14px;font-size:44px;line-height:1.08;letter-spacing:-.5px}
.tag i{font-family:"Instrument Serif",serif;font-weight:400;color:#C4B5FD;font-size:1.1em}
.chips{display:flex;gap:10px;margin-top:24px}
.chips span{font-size:17px;font-weight:500;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.in{color:#10B981}
</style></head><body><div class="bg"></div><div class="paper"></div>
<div class="wrap"><div class="icon"><img src="../landing/logo.png"></div>
<div><h1>Niz Khata</h1><div class="tag">Every entry, <i>written down.</i></div>
<div class="chips"><span>Expenses</span><span>Dues</span><span>Debts</span><span>Card bills</span><span class="in">Any currency</span></div></div></div>
</body></html>
