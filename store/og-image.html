<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:Inter,sans-serif;color:#ECEEF6;background:#0B0F1C}
.bg{position:absolute;inset:0;background:
 radial-gradient(600px 480px at 12% 18%,rgba(79,70,229,.55),transparent 70%),
 radial-gradient(520px 420px at 92% 28%,rgba(124,58,237,.45),transparent 70%),
 radial-gradient(500px 340px at 70% 110%,rgba(16,185,129,.22),transparent 70%)}
.paper{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 64px,rgba(248,113,113,.14) 64px 65px,transparent 65px),repeating-linear-gradient(180deg,transparent 0 41px,rgba(255,255,255,.035) 41px 42px)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:52px;padding:0 80px 0 120px}
.icon{width:250px;height:250px;flex:none;border-radius:60px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 100px 12px rgba(79,70,229,.5)}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:92px;font-weight:800;letter-spacing:-3px;line-height:1}
.tag{margin-top:14px;font-size:50px;line-height:1.08;letter-spacing:-.6px}
.tag i{font-family:"Instrument Serif",serif;font-weight:400;color:#C4B5FD;font-size:1.1em}
.by{margin-top:26px;font-size:22px;color:#9AA3B8;font-weight:500}
.by b{color:#ECEEF6;font-weight:700}
</style></head><body><div class="bg"></div><div class="paper"></div>
<div class="wrap"><div class="icon"><img src="../landing/logo.png"></div>
<div><h1>Niz Khata</h1><div class="tag">Every entry, <i>written down.</i></div>
<div class="by">Free on Android · by <b>Valorum Labs</b></div></div></div>
</body></html>
